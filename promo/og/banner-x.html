<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1500px;height:500px;overflow:hidden;font-family:"Adwaita Sans","Inter","Noto Sans",sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:#111118;position:relative}
.wall{position:absolute;left:-150px;top:-175px;width:1875px;display:grid;grid-template-columns:repeat(7,1fr);gap:16px;transform:rotate(-8deg);opacity:.9}
.wall img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.glow{position:absolute;inset:0;background:radial-gradient(705px 400px at 83% 16%, rgba(157,124,242,.28), transparent 60%),radial-gradient(600px 400px at 10% 90%, rgba(158,206,106,.18), transparent 60%)}
.shade{position:absolute;inset:0;background:radial-gradient(760px 330px at 750px 250px, rgba(14,14,21,.95) 0%, rgba(14,14,21,.88) 50%, rgba(14,14,21,.35) 80%, rgba(14,14,21,0) 100%),linear-gradient(rgba(14,14,21,.25),rgba(14,14,21,.25))}
.box{position:absolute;left:300px;top:0;width:900px;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.box.y{top:0px}
.wm{display:flex;gap:26px;align-items:center;margin-bottom:22px}
.wm img{height:68px;image-rendering:pixelated}
h1{font-size:76px;line-height:1.0;font-weight:800;letter-spacing:-2.0px}
h1 span{color:#9ece6a}
.sub{font-size:31px;color:rgba(255,255,255,.9);margin-top:16px;font-weight:600}
.url{display:inline-block;margin-top:18px;font-size:32px;font-weight:800;color:#111118;background:#9ece6a;padding:10px 34px;border-radius:42px}
</style></head><body>
