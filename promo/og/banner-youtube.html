<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2560px;height:1440px;overflow:hidden;font-family:"Adwaita Sans","Inter","Noto Sans",sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:#111118;position:relative}
.wall{position:absolute;left:-256px;top:-504px;width:3200px;display:grid;grid-template-columns:repeat(9,1fr);gap:27px;transform:rotate(-8deg);opacity:.9}
.wall img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:17px;box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.glow{position:absolute;inset:0;background:radial-gradient(1203px 1152px at 83% 16%, rgba(157,124,242,.28), transparent 60%),radial-gradient(1024px 1152px at 10% 90%, rgba(158,206,106,.18), transparent 60%)}
.shade{position:absolute;inset:0;background:radial-gradient(1100px 420px at 1280px 720px, rgba(14,14,21,.95) 0%, rgba(14,14,21,.88) 50%, rgba(14,14,21,.35) 80%, rgba(14,14,21,0) 100%),linear-gradient(rgba(14,14,21,.25),rgba(14,14,21,.25))}
.box{position:absolute;left:530px;top:0;width:1500px;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.box.y{top:0px}
.wm{display:flex;gap:21px;align-items:center;margin-bottom:18px}
.wm img{height:56px;image-rendering:pixelated}
h1{font-size:84px;line-height:1.0;font-weight:800;letter-spacing:-2.2px}
h1 span{color:#9ece6a}
.sub{font-size:34px;color:rgba(255,255,255,.9);margin-top:17px;font-weight:600}
.url{display:inline-block;margin-top:19px;font-size:34px;font-weight:800;color:#111118;background:#9ece6a;padding:11px 36px;border-radius:44px}
