<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a8f"/>
      <stop offset="0.55" stop-color="#2a4fb8"/>
      <stop offset="1" stop-color="#14a3c7"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dfe9ff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef0ff"/>
      <stop offset="1" stop-color="#3fd0a8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shine)"/>
  <!-- snap layout: one tall window snapped left, two stacked on the right -->
  <rect x="88" y="84" width="160" height="236" rx="22" fill="url(#hot)"/>
  <rect x="264" y="84" width="160" height="110" rx="22" fill="url(#pane)"/>
  <rect x="264" y="210" width="160" height="110" rx="22" fill="url(#pane)"/>
  <!-- title bar dots on the snapped window -->
  <circle cx="114" cy="110" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="138" cy="110" r="8" fill="#ffffff" opacity="0.6"/>
  <!-- frosted dock -->
  <rect x="104" y="356" width="304" height="76" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
  <rect x="134" y="374" width="40" height="40" rx="11" fill="#7ef0ff"/>
  <rect x="190" y="374" width="40" height="40" rx="11" fill="#ffffff" opacity="0.9"/>
  <rect x="246" y="374" width="40" height="40" rx="11" fill="#ffffff" opacity="0.9"/>
  <rect x="302" y="374" width="40" height="40" rx="11" fill="#ffffff" opacity="0.9"/>
  <rect x="358" y="374" width="20" height="40" rx="8" fill="#ffffff" opacity="0.5"/>
</svg>
