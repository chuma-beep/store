<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omarchy Store</title>
    <link rel="stylesheet" href="css/popup.css">
  </head>
  <body>
    <div class="container">
      <header>
        <img src="images/omarchy-wordmark.svg" alt="Omarchy Store" class="wordmark">
        <h1>Omarchy Store</h1>
      </header>
      
      <nav>
        <ul>
          <li><a href="#" class="active">Apps</a></li>
          <li><a href="#themes">Themes</a></li>
          <li><a href="#plugins">Plugins</a></li>
          <li><a href="#updates">Updates</a></li>
        </ul>
      </nav>
      
      <main>
        <section id="apps" class="panel active">
          <h2>Featured Apps</h2>
          <p> Browse and install apps with one click </p>
        </section>
        
        <section id="themes" class="panel">
          <h2>Themes</h2>
          <p> Browse and install themes </p>
        </section>
        
        <section id="plugins" class="panel">
          <h2>Plugins</h2>
          <p> Browse and install plugins </p>
        </section>
        
        <section id="updates" class="panel">
          <h2>Updates</h2>
          <p> Check for and apply updates </p>
        </section>
      </main>
      
      <footer>
        <p>Omarchy Store v1.7.5 • Open Source</p>
      </footer>
    </div>
  </body>
</html>
